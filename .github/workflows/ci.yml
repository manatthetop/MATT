name: CI

# Run the test suite on every push and PR to main. MATT has no runtime
# dependencies -- the whole program is the standard library -- so there is
# nothing to install; CI just checks out the code and runs unittest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Byte-compile the package (syntax check)
        run: python -m compileall -q matt tests

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  windows-zipapp-smoke-test:
    # Proves what install.ps1 actually delivers: build matt.pyz exactly like
    # the Release workflow does, then run it for real on Windows (not just
    # the unittest suite) against a sample capture report, covering the
    # offline analyze/identify/crack paths install.ps1 advertises as working.
    name: matt.pyz smoke test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the zipapp binary
        shell: bash
        run: |
          rm -rf build && mkdir -p build
          cp -r matt build/
          printf 'import sys\nfrom matt.cli import main\nsys.exit(main())\n' > build/__main__.py
          python -m zipapp build -o matt.pyz

      - name: matt.pyz --version
        run: python matt.pyz --version

      - name: matt.pyz --help
        run: python matt.pyz --help

      - name: matt.pyz --analyze-only / --table / --identify (offline path)
        run: |
          python matt.pyz --analyze-only examples\enterprise_capture.json --table --no-banner
          python matt.pyz --identify 5f4dcc3b5aa765d61d8327deb882cf99 --no-banner

      - name: matt.pyz --crack (real hashcat path, no network)
        # windows-latest hosted runners have no GPU and no OpenCL/CUDA/HIP
        # runtime installed, so a real crack on this box is not achievable --
        # this proves the --crack path really invokes hashcat.exe and
        # reports *that* cleanly, not that it can crack on hardware GitHub
        # doesn't give us. On a real Windows PC with a GPU driver installed,
        # the same path recovers the password (verified locally on Linux
        # with real hashcat: msmith's Summer2026! cracks on the first try).
        shell: bash
        run: |
          choco install hashcat -y --no-progress
          # The chocolatey package extracts the real binary to
          # C:\tools\hashcat-<ver>\hashcat.exe and only shims it onto PATH as
          # a broken redirect to powershell.exe (seen on windows-latest as of
          # 2026-11), so "hashcat" on PATH silently runs PowerShell instead of
          # cracking anything. Put the real binary ahead of that shim.
          real_hashcat="$(find /c/tools -maxdepth 2 -iname hashcat.exe | head -1)"
          export PATH="$(dirname "$real_hashcat"):$PATH"
          hashcat --version
          printf 'letmein\npassword123\nSummer2026!\n' > wl.txt
          out="$(python matt.pyz --analyze-only examples/enterprise_capture.json --crack --wordlist wl.txt --no-banner)"
          echo "$out"
          grep -q 'no OpenCL/CUDA/HIP runtime found' <<<"$out" || { echo "::error::expected matt to report the missing OpenCL/CUDA/HIP runtime cleanly on Windows"; exit 1; }

  windows:
    name: unittest (windows, py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Byte-compile the package (syntax check)
        run: python -m compileall -q matt tests

      - name: Run the test suite
        run: python -m unittest discover -s tests -v
